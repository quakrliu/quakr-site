<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Deep Blue top bar -->
  <rect x="0" y="0" width="1200" height="80" fill="#1B3A5C"/>

  <!-- PassiveYieldLab label in top bar -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">PassiveYieldLab</text>

  <!-- Fear & Greed badge -->
  <rect x="900" y="15" width="240" height="50" rx="8" fill="#D32F2F"/>
  <text x="1020" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FEAR &amp; GREED INDEX</text>
  <text x="1020" y="56" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">28 — DEEP PANIC</text>

  <!-- Main title -->
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#1B3A5C">DeFi Liquidity Mining</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1B3A5C">While the Market Panics</text>

  <!-- Subtitle -->
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="26" fill="#444444">My 3-10% APY Playbook — July 2026</text>

  <!-- Three layer boxes -->
  <!-- Layer 1 -->
  <rect x="60" y="320" width="320" height="120" rx="12" fill="#1B3A5C"/>
  <text x="220" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#AACCE8" text-anchor="middle">LAYER 1 — SAFEST</text>
  <text x="220" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">Lido stETH</text>
  <text x="220" y="418" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4FC3F7" text-anchor="middle">~3-3.2% APY*</text>

  <!-- Layer 2 -->
  <rect x="420" y="320" width="320" height="120" rx="12" fill="#1B3A5C"/>
  <text x="580" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#AACCE8" text-anchor="middle">LAYER 2 — STABLE</text>
  <text x="580" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">Aave USDC</text>
  <text x="580" y="418" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4FC3F7" text-anchor="middle">~3-5% APY*</text>

  <!-- Layer 3 -->
  <rect x="780" y="320" width="360" height="120" rx="12" fill="#1B3A5C"/>
  <text x="960" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#AACCE8" text-anchor="middle">LAYER 3 — HIGHER YIELD</text>
  <text x="960" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">EigenLayer</text>
  <text x="960" y="418" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4FC3F7" text-anchor="middle">~5-15% APY*</text>

  <!-- DeFi performance badge -->
  <rect x="60" y="470" width="300" height="60" rx="8" fill="#1B5E20"/>
  <text x="210" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#A5D6A7" text-anchor="middle">DeFi SECTOR PERFORMANCE</text>
  <text x="210" y="520" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">+9.8% while market panics</text>

  <!-- APY disclaimer -->
  <text x="60" y="590" font-family="Arial, sans-serif" font-size="14" fill="#888888">* APY estimates as of July 25, 2026. APY fluctuates. Not financial advice.</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#1B3A5C"/>
</svg>
