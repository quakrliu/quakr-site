<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#1B3A5C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2E6DA4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E6DA4;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#1B3A5C" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top header bar -->
  <rect x="0" y="0" width="1200" height="78" fill="#1B3A5C"/>

  <!-- Header text: PASSIVEYIELDLAB -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="3">PASSIVEYIELDLAB</text>

  <!-- EXPIRY DAY badge -->
  <rect x="930" y="18" width="216" height="42" rx="6" fill="#C0392B"/>
  <text x="1038" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EXPIRY DAY · JUNE 26</text>

  <!-- Main title line 1 -->
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#1B3A5C">BTC June Options Expiry</text>

  <!-- Main title line 2 -->
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#1B3A5C">Is $60K Holding?</text>

  <!-- Subtitle -->
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="26" fill="#444444">Your Hedging Playbook for</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="26" fill="#444444">June 26 – July 1, 2026</text>

  <!-- Key data row -->
  <rect x="60" y="350" width="760" height="44" rx="4" fill="#1B3A5C" opacity="0.08"/>
  <text x="80" y="378" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">BTC ~$61K</text>
  <text x="230" y="378" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">$1B Liquidation Risk</text>
  <text x="500" y="378" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">6-Week ETF Outflow</text>

  <text x="60" y="425" font-family="Arial, sans-serif" font-size="14" fill="#888888">Data as of June 25, 2026 · Prices fluctuate</text>

  <!-- Accent line at bottom -->
  <rect x="0" y="580" width="1200" height="6" fill="url(#accentLine)"/>

  <!-- Bottom info -->
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="16" fill="#1B3A5C" opacity="0.7">passiveyieldlab.com</text>
  <text x="1140" y="615" font-family="Arial, sans-serif" font-size="16" fill="#1B3A5C" opacity="0.7" text-anchor="end">June 2026</text>

  <!-- Chart icon area (right side) -->
  <circle cx="1020" cy="340" r="120" fill="#1B3A5C" opacity="0.05"/>
  <circle cx="1020" cy="340" r="90" fill="#1B3A5C" opacity="0.05"/>

  <!-- Simplified chart line -->
  <polyline points="950,400 975,370 1000,380 1025,330 1050,310 1075,350 1090,300"
    fill="none" stroke="#1B3A5C" stroke-width="3" opacity="0.25"/>
  <!-- $60K support line -->
  <line x1="940" y1="360" x2="1100" y2="360" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="1020" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" opacity="0.5" text-anchor="middle">$60K SUPPORT</text>
</svg>
