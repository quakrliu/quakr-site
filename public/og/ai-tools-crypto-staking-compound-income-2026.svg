<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F0EB"/>
  <!-- Top brand bar -->
  <rect width="1200" height="80" fill="#1B3A5C"/>
  <text x="600" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PassiveYieldLab</text>
  <!-- Card background -->
  <rect x="60" y="110" width="1080" height="390" rx="12" fill="#FFFFFF" opacity="0.90"/>
  <!-- Green strategy badge -->
  <rect x="80" y="128" width="220" height="38" rx="6" fill="#1B7C3E"/>
  <text x="190" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COMPOUND STRATEGY</text>
  <!-- Main headline -->
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#1B3A5C" text-anchor="middle">AI Tools + Crypto Staking</text>
  <text x="600" y="268" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#333333" text-anchor="middle">Two Streams. One Laptop. 2026.</text>
  <!-- Divider -->
  <line x1="120" y1="295" x2="1080" y2="295" stroke="#1B3A5C" stroke-width="1.5" opacity="0.2"/>
  <!-- Three stat boxes -->
  <rect x="120" y="315" width="280" height="130" rx="8" fill="#F0F7F0"/>
  <text x="260" y="358" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">AI Content Monthly</text>
  <text x="260" y="405" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1B7C3E" text-anchor="middle">$300-$2K</text>
  <text x="260" y="432" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">Canva AI + Claude</text>

  <rect x="460" y="315" width="280" height="130" rx="8" fill="#EFF4FB"/>
  <text x="600" y="358" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Staking Yield APY</text>
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1B3A5C" text-anchor="middle">3–8%</text>
  <text x="600" y="432" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">SOL / ETH / DeFi</text>

  <rect x="800" y="315" width="260" height="130" rx="8" fill="#FFF8EE"/>
  <text x="930" y="358" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Tool Stack Cost</text>
  <text x="930" y="405" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#C0722B" text-anchor="middle">~$42/mo</text>
  <text x="930" y="432" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">Covered by staking</text>

  <!-- Footer tag -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="20" fill="#666666" text-anchor="middle">Passive income isn't lazy money — it's freedom money.</text>
