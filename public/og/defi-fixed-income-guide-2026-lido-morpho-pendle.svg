  <rect width="1200" height="630" fill="#F5F0EB"/>

  <!-- Top blue bar -->
  <rect width="1200" height="80" fill="#1B3A5C"/>

  <!-- Bottom blue accent bar -->
  <rect y="570" width="1200" height="60" fill="#1B3A5C"/>

  <!-- PassiveYieldLab in top bar -->
