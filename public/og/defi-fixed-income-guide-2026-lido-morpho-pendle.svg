  <rect x="60" y="360" width="240" height="110" rx="12" fill="#1B3A5C" opacity="0.9"/>
  <text x="180" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A8C4E0" text-anchor="middle">Lido stETH</text>
