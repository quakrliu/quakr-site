  <text x="990" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A8C4E0" text-anchor="middle">Aave USDC</text>
  <text x="990" y="432" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3–5%</text>
