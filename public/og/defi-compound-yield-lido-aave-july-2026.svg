<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#1B3A5C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2980B9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#1B3A5C" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="80" fill="#1B3A5C"/>
  <text x="60" y="52" font-family="Georgia, serif" font-size="28" fill="#FFFFFF" font-weight="bold">PassiveYieldLab</text>
  <text x="1140" y="52" font-family="Arial, sans-serif" font-size="22" fill="#A8C6E0" text-anchor="end">July 2026</text>

  <!-- Category badge -->
  <rect x="60" y="110" width="120" height="34" rx="6" fill="#1B3A5C" opacity="0.12"/>
  <text x="120" y="132" font-family="Arial, sans-serif" font-size="16" fill="#1B3A5C" font-weight="bold" text-anchor="middle">DeFi Yield</text>

  <!-- Main title -->
  <text x="60" y="200" font-family="Georgia, serif" font-size="52" fill="#1B3A5C" font-weight="bold">DeFi Compound Yield 2026</text>
  <text x="60" y="268" font-family="Georgia, serif" font-size="40" fill="#333333">Lido 3.5% + Aave 3-4%</text>
  <text x="60" y="328" font-family="Georgia, serif" font-size="40" fill="#333333">= <tspan fill="#1B3A5C" font-weight="bold">6-7% Real APY</tspan></text>

  <!-- Subtitle -->
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="24" fill="#555555">Three risk tiers, $1K step-by-step, liquidation risks explained</text>

  <!-- APY stat boxes -->
  <rect x="60" y="430" width="200" height="110" rx="10" fill="#1B3A5C" opacity="0.08"/>
  <text x="160" y="475" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">LIDO stETH</text>
  <text x="160" y="515" font-family="Georgia, serif" font-size="36" fill="#1B3A5C" font-weight="bold" text-anchor="middle">3.5%</text>

  <text x="285" y="492" font-family="Georgia, serif" font-size="36" fill="#999999" text-anchor="middle">+</text>

  <rect x="310" y="430" width="200" height="110" rx="10" fill="#1B3A5C" opacity="0.08"/>
  <text x="410" y="475" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">AAVE USDC</text>
  <text x="410" y="515" font-family="Georgia, serif" font-size="36" fill="#1B3A5C" font-weight="bold" text-anchor="middle">3-4%</text>

  <text x="535" y="492" font-family="Georgia, serif" font-size="36" fill="#999999" text-anchor="middle">=</text>

  <rect x="560" y="420" width="230" height="120" rx="10" fill="#1B3A5C" opacity="0.90"/>
  <text x="675" y="470" font-family="Arial, sans-serif" font-size="14" fill="#A8C6E0" text-anchor="middle">EFFECTIVE APY</text>
  <text x="675" y="520" font-family="Georgia, serif" font-size="46" fill="#FFFFFF" font-weight="bold" text-anchor="middle">6-7%</text>

  <!-- Bottom accent line -->
  <rect x="0" y="610" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- Footer -->
  <text x="60" y="625" font-family="Arial, sans-serif" font-size="16" fill="#999999">APY as of July 2026 • APY fluctuates • Not financial advice</text>
  <text x="1140" y="625" font-family="Arial, sans-serif" font-size="16" fill="#999999" text-anchor="end">passiveyieldlab.com</text>
</svg>
