<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#1B3A5C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2E6DA4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E6DA4;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#1B3A5C" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top header bar -->
  <rect x="0" y="0" width="1200" height="78" fill="#1B3A5C"/>

  <!-- Header text: PASSIVEYIELDLAB -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="3">PASSIVEYIELDLAB</text>

  <!-- EU Regulation badge -->
  <rect x="960" y="18" width="186" height="42" rx="6" fill="#2E6DA4"/>
  <text x="1053" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EU CASP · JULY 1</text>

  <!-- Main title -->
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B3A5C" text-anchor="start">EU CASP Kicks In</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B3A5C" text-anchor="start">July 1, 2026</text>

  <!-- Subtitle -->
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="26" fill="#444444">What It Actually Means for Your</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="26" fill="#444444">Crypto Yield Strategy</text>

  <!-- APY comparison mini-table -->
  <rect x="60" y="360" width="750" height="40" rx="4" fill="#1B3A5C" opacity="0.08"/>
  <text x="80" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">Lido stETH: 3.0–3.5%</text>
  <text x="310" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">Aave USDC: 2–8%</text>
  <text x="540" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1B3A5C">EigenLayer: 3.8–6.0%</text>

  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" fill="#888888">APY as of June 25, 2026 · APY fluctuates</text>

  <!-- Accent line at bottom -->
  <rect x="0" y="580" width="1200" height="6" fill="url(#accentLine)"/>

  <!-- Bottom info -->
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="16" fill="#1B3A5C" opacity="0.7">passiveyieldlab.com</text>
  <text x="1140" y="615" font-family="Arial, sans-serif" font-size="16" fill="#1B3A5C" opacity="0.7" text-anchor="end">June 2026</text>

  <!-- Shield icon area (right side visual) -->
  <circle cx="1020" cy="350" r="120" fill="#1B3A5C" opacity="0.05"/>
  <circle cx="1020" cy="350" r="90" fill="#1B3A5C" opacity="0.05"/>
  <text x="1020" y="310" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" fill="#1B3A5C" opacity="0.18">🛡</text>
  <text x="1020" y="385" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1B3A5C" opacity="0.4" text-anchor="middle">YIELD</text>
  <text x="1020" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1B3A5C" opacity="0.4" text-anchor="middle">SAFETY</text>
</svg>
